# 차량 실측 치수 (2026-10-16 실측). 단위 m.
# 좌표계 (모든 새 코드의 기준): 원점 = 차 앞끝(앞범퍼) 바로 아래 바닥, 차 폭 가운데
#   x = 앞(+), y = 왼쪽(+), z = 위(+)
vehicle:
  length_m: 0.98            # 전장
  width_m: 0.49             # 전폭
  track_m: 0.43             # 차륜거리 (좌우 바퀴 중심 사이)
  wheelbase_m: 0.56         # 축간거리
  front_overhang_m: 0.23    # 앞범퍼 ~ 앞바퀴 축
  rear_overhang_m: 0.19     # 뒷바퀴 축 ~ 뒷범퍼 (= 0.98 - 0.56 - 0.23)

# 위 값에서 나온 점들 (x, y, z)
points:
  front_bumper: [0.0, 0.0, 0.0]
  front_axle:   [-0.23, 0.0, 0.0]
  rear_axle:    [-0.79, 0.0, 0.0]
  rear_bumper:  [-0.98, 0.0, 0.0]

camera:
  lens: [-0.544, 0.0, 0.58]   # 렌즈 위치. 앞바퀴 축보다 0.314 m 뒤, 뒷바퀴 축보다 0.246 m 앞. 좌우 가운데 (10/16 사용자 확인)
  pitch_deg: 17.5             # 정면에서 아래로 (각도기 실측). 주행 사진의 차로 폭과 모순 없음 (ground_model.py)
  yaw_deg: 4.96               # 차체보다 왼쪽을 보는 각도. 10/16 정지 시험 (static_check.py, 앞/뒷바퀴→점선 17 cm)

# 차 움직임 (고스트 이동에 씀)
motion:
  adc_center: 462             # 바퀴 똑바로일 때 ADC (펌웨어 1010f POT_CENTER, 10/09 실측)
  deg_per_count_left: 0.2846  # 10/16 왼쪽 끝 회전 원 지름 336.6 cm (바깥 앞바퀴) → 등가 22.20°, ADC 540-462=78 칸
  deg_per_count_right: 0.3040 # 10/16 오른쪽 끝 회전 원 지름 357.8 cm → 20.67°, ADC 462-394=68 칸
  understeer_ratio: 0.46      # 실제 회전 / 기하학 회전 (v·tanδ/L). 10/10 주행 사진 쌍 118 개 전체 (95% 0.40~0.52)
  understeer_table:           # 조향 크기별 같은 비율 [조향각 °, 비율] (구간 0~6° n=23, 6~13° n=32, 13~24° n=63). 사이는 직선으로
  - [3.0, 0.82]
  - [9.5, 0.48]
  - [18.0, 0.45]
  lock_deg_left: 22.20        # 조향 끝 (= 명령 -100) 등가 각도, 10/16 회전 원 실측
  lock_deg_right: 20.67       # 조향 끝 (= 명령 +100)
  speed_mps: 0.71             # PWM 255 주행 속도. 같은 사진 쌍 (중앙값)
